# Replaces ONLY the old hostname's configuration, never the www production site.
server {
    listen 80;
    server_name pontodecoletaadl.servehttp.com;
    location ^~ /webhooks/fastflow {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }
    location / { return 301 https://pontodecoletaadl.servehttp.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name pontodecoletaadl.servehttp.com;
    ssl_certificate /etc/letsencrypt/live/pontodecoletaadl.servehttp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pontodecoletaadl.servehttp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 10m;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Old signed payment notifications still go to production.
    location ^~ /webhooks/fastflow {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }
    location / {
        auth_basic "Ambiente de testes Adelinha";
        auth_basic_user_file /etc/nginx/.htpasswd-ponto-coleta-teste;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }
}
