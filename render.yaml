services:
  - type: web
    name: ponto-coleta-adelinha-teste
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT 'app:create_app()'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: STAFF_USER
        value: admin
      - key: STAFF_PASSWORD_HASH
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: COOKIE_SECURE
        value: "1"
