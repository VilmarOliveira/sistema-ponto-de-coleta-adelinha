{% extends 'base.html' %}{% block content %}<section class="login-card"><h1>Recuperar acesso da equipe</h1>{% if stage=='request' %}<p>Informe o e-mail da sua conta. O código será enviado exclusivamente por e-mail.</p><form method="post"><input type="hidden" name="stage" value="request"><label>E-mail<input type="email" name="email" required autocomplete="email"></label><button class="button primary full">Enviar código</button></form>{% else %}<p>Confira {{ masked_contact|default('o e-mail cadastrado') }}.</p><form method="post"><input type="hidden" name="stage" value="confirm"><label>Código<input name="code" required maxlength="6" inputmode="numeric"></label><label>Nova senha<input type="password" name="password" required minlength="8"></label><label>Confirmar senha<input type="password" name="password_confirm" required minlength="8"></label><button class="button primary full">Alterar senha</button></form>{% endif %}<a class="button ghost bottom-back" href="{{ url_for('login') }}">← Voltar</a></section>{% endblock %}
