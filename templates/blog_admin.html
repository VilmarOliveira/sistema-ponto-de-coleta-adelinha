{% extends 'base.html' %}{% block content %}<section class="panel-card"><span class="eyebrow">ÁREA DO PONTO</span><h1>Editor do blog</h1><form method="post" enctype="multipart/form-data"><label>Título<input name="title" required></label><label>Resumo<textarea name="summary" required></textarea></label><label>Imagem de capa<input type="file" name="cover_image" accept="image/png,image/jpeg,image/webp"></label><label>Descrição alternativa da imagem<input name="cover_alt"></label><label>Corpo do artigo<textarea name="body" rows="14" required></textarea></label><label>Endereço do artigo<input name="slug" placeholder="receber-compras-online-em-franca" required pattern="[a-z0-9-]+"></label><label>Título para buscadores<input name="seo_title"></label><label>Descrição para buscadores<textarea name="seo_description"></textarea></label><button class="button ghost" name="action" value="draft">Salvar rascunho</button><button class="button primary" name="action" value="publish">Publicar</button></form><h2>Artigos</h2>{% for post in posts %}<p><b>{{ post.title }}</b> · {{ post.status }} · <a href="{{ url_for('blog_admin',edit=post.id) }}">Editar</a> · <a href="{{ url_for('blog_post',slug=post.slug) }}">Visualizar</a></p><form method="post" action="{{ url_for('blog_unpublish',post_id=post.id) }}"><button class="button danger small">Retirar da publicação</button></form>{% endfor %}</section>{% endblock %}
